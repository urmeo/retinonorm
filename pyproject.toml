[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cortexprobe"
version = "0.1.0"
description = "Population receptive fields and lesion effects in convolutional models of the visual hierarchy"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Urme" }]
keywords = ["neuroscience", "population-receptive-field", "retinotopy", "vision", "lesion"]
classifiers = [
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=1.24,<3",
  "scipy>=1.10,<2",
  "pandas>=2.0,<3",
]

[project.optional-dependencies]
models = ["torch>=2.2,<3", "torchvision>=0.17,<1"]
viz = ["matplotlib>=3.7,<4"]
dev = [
  "pytest>=8.0,<9",
  "pytest-cov>=5.0,<7",
  "hypothesis>=6.100,<7",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
]

[project.scripts]
cortexprobe = "cortexprobe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "ARG", "C4", "PT"]
ignore = ["N803", "N806"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG"]

[tool.mypy]
python_version = "3.9"
files = ["src"]
strict = true
warn_unreachable = true
disallow_any_generics = false
plugins = []

[[tool.mypy.overrides]]
module = ["scipy.*", "pandas.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "slow: runs hundreds of fits; deselect with -m 'not slow'",
]

[tool.coverage.run]
branch = true
source = ["src/cortexprobe"]

[tool.coverage.report]
fail_under = 85
show_missing = true
