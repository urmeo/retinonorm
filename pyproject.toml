[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cortexprobe"
version = "0.1.0"
description = "Population receptive fields and lesion effects in convolutional models of the visual hierarchy"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Urme" }]
keywords = ["neuroscience", "population-receptive-field", "retinotopy", "vision", "lesion"]
classifiers = [
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=1.24,<3",
  "scipy>=1.11,<2",
]

[project.optional-dependencies]
io = ["pandas>=2.0,<3", "pyarrow>=15.0"]
models = ["torch>=2.2,<3", "torchvision>=0.17,<1"]
viz = ["matplotlib>=3.7,<4"]
dev = [
  "pytest>=8.0,<9",
  "pytest-cov>=5.0,<7",
  "hypothesis>=6.100,<7",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "ARG", "C4", "PT"]
ignore = ["N803", "N806"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG"]
# from_dict resolves these annotations with get_type_hints, which *evaluates* them, so the
# future import does not make PEP 604 unions safe here. `X | None` raises TypeError on
# Python 3.9, which this project still supports. PEP 585 builtin generics are fine: they
# landed in 3.9.
"src/cortexprobe/config.py" = ["UP007", "UP045"]

[tool.mypy]
# No python_version pin: mypy takes it from the interpreter, so the 3.9 and 3.12 CI jobs each
# check their own semantics against the numpy stubs actually installed there. Pinning 3.9 made
# mypy fail to parse modern numpy stubs, which use syntax newer than the pinned version.
files = ["src"]
strict = true
warn_unreachable = true
disallow_any_generics = false
plugins = []

[[tool.mypy.overrides]]
module = ["scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "slow: runs hundreds of fits; deselect with -m 'not slow'",
]

[tool.coverage.run]
branch = true
source = ["src/cortexprobe"]

[tool.coverage.report]
fail_under = 85
show_missing = true
